name: Publish Tauri latest

on:
  push:
    branches:
      - Tauri
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Do not allow concurrent uploads to the rolling tauri-latest release.
  group: tauri-latest-release
  cancel-in-progress: false

jobs:
  package:
    name: Build Linux desktop packages
    runs-on: ubuntu-22.04
    steps:
      - name: Check out Tauri publication branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            pkg-config \
            wget

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version '^2.0.0' --locked

      - name: Build DEB, RPM, and AppImage
        run: ./scripts/build-tauri-linux.sh

      - name: Publish rolling prerelease assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: tauri-latest
          target_commitish: ${{ github.sha }}
          name: jsA8E Tauri latest
          prerelease: true
          generate_release_notes: false
          overwrite_files: true
          body: |
            Automatic build from branch `Tauri`.
            Commit: ${{ github.sha }}

            These DEB, RPM, and AppImage assets are replaced by the next successful Tauri build.
          files: |
            dist/tauri/linux/*.deb
            dist/tauri/linux/*.rpm
            dist/tauri/linux/*.AppImage
          fail_on_unmatched_files: true
